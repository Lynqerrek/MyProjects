<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover" />
    <title>lynqerrek · Projects</title>
    <meta name="theme-color" content="#050b1d" />
    <meta
      name="description"
      content="lynqerrek — selected projects with iOS-inspired optical liquid glass."
    />
    <meta property="og:title" content="lynqerrek · Projects" />
    <meta
      property="og:description"
      content="lynqerrek — selected projects with iOS-inspired optical liquid glass."
    />
    <meta property="og:type" content="website" />
    <meta name="twitter:card" content="summary_large_image" />
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link
      href="https://fonts.googleapis.com/css2?family=JetBrains+Mono:wght@400;500&family=Plus+Jakarta+Sans:wght@300;400;500;600;700&family=Sora:wght@500;600;700&display=swap"
      rel="stylesheet"
    />
    <link
      rel="stylesheet"
      href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css"
    />
    <style>
:root {
  --city-image: none;
  --glass: rgba(8, 15, 31, 0.34);
  --glass-light: rgba(255, 255, 255, 0.075);
  --glass-hover: rgba(255, 255, 255, 0.13);
  --glass-border: rgba(222, 239, 255, 0.20);
  --glass-border-hover: rgba(235, 248, 255, 0.40);
  --text: #f4f7ff;
  --text-sec: #b5c3d8;
  --muted: #8795ad;
  --muted2: #3d4962;
  --g1: #6deaff;
  --g2: #ff67b7;
  --g3: #9a8cff;
  --green: #65e7ff;
  --font: -apple-system, BlinkMacSystemFont, 'SF Pro Text', 'SF Pro Display', 'Plus Jakarta Sans', sans-serif;
  --font-display: -apple-system, BlinkMacSystemFont, 'SF Pro Display', 'Sora', 'Plus Jakarta Sans', sans-serif;
  --mono: 'SF Mono', 'JetBrains Mono', ui-monospace, monospace;
  --r: 26px;
  --r-sm: 20px;
  --r-xs: 9999px;
  --r-icon: 13px;
  --glass-ink: 7, 13, 30;
  --glass-white: 244, 251, 255;
  --glass-cyan: 91, 226, 255;
  --glass-pink: 255, 91, 174;
  --glass-edge: rgba(231, 247, 255, 0.28);
}

*, *::before, *::after {
  box-sizing: border-box;
  margin: 0;
  padding: 0;
}

html {
  scroll-behavior: smooth;
  background: #050a18;
  scrollbar-width: none;
  -ms-overflow-style: none;
}

html::-webkit-scrollbar,
body::-webkit-scrollbar {
  display: none;
  width: 0;
  height: 0;
}

body {
  color: #f4f7ff;
  color: var(--text);
  font-family: var(--font);
  min-height: 100vh;
  overflow-x: hidden;
  background: #050a18;
}

.lg-webgl-canvas {
  position: fixed;
  inset: 0;
  width: 100vw;
  height: 100vh;
  z-index: 4;
  pointer-events: none;
}

.lg-webgl-overlay-canvas {
  position: fixed;
  inset: 0;
  width: 100vw;
  height: 100vh;
  z-index: 99;
  pointer-events: none;
}

/* ──────────────────────────────────────────
   NEON CITY BACKGROUND (Zoomed + Scroll Parallax)
────────────────────────────────────────── */
.city-bg {
  position: fixed;
  inset: 0;
  z-index: 0;
  background-image: var(--city-image);
  background-size: cover;
  background-position: center center;
  background-repeat: no-repeat;
  filter: blur(0.25px) brightness(0.78) saturate(1.40) contrast(1.06);
  transform: translate3d(0, var(--bg-parallax-y, 0px), 0) scale(1.26);
  transform-origin: center center;
  will-change: transform;
}

.city-scrim {
  position: fixed;
  inset: 0;
  z-index: 1;
  background:
    linear-gradient(180deg, rgba(3, 7, 20, 0.24) 0%, rgba(3, 7, 20, 0.16) 44%, rgba(3, 7, 20, 0.54) 100%),
    radial-gradient(ellipse 82% 58% at 48% 30%, rgba(52, 218, 255, 0.08), transparent 68%),
    radial-gradient(ellipse 54% 48% at 92% 54%, rgba(255, 74, 159, 0.08), transparent 66%);
  pointer-events: none;
}

.orbs {
  position: fixed;
  inset: 0;
  z-index: 2;
  pointer-events: none;
  overflow: hidden;
}
.orb {
  position: absolute;
  border-radius: 50%;
  opacity: 0.72;
}
.orb1 {
  width: 500px;
  height: 500px;
  background: radial-gradient(circle, rgba(93, 226, 255, 0.085) 0%, transparent 70%);
  top: -150px;
  left: -80px;
}
.orb2 {
  width: 380px;
  height: 380px;
  background: radial-gradient(circle, rgba(255, 90, 177, 0.075) 0%, transparent 70%);
  bottom: -100px;
  right: -60px;
}
.orb3 {
  width: 280px;
  height: 280px;
  background: radial-gradient(circle, rgba(143, 132, 255, 0.05) 0%, transparent 70%);
  top: 40%;
  left: 50%;
}

.grain {
  display: none;
}

/* ──────────────────────────────────────────
   LAYOUT
────────────────────────────────────────── */
.page {
  position: relative;
  z-index: 10;
  max-width: 700px;
  margin: 0 auto;
  padding: 0 20px;
}

/* ──────────────────────────────────────────
   LOADER & ERROR
────────────────────────────────────────── */
#loader {
  min-height: 100vh;
  display: flex;
  flex-direction: column;
  align-items: center;
  justify-content: center;
  gap: 18px;
}
.ld-ring {
  width: 40px;
  height: 40px;
  border-radius: 50%;
  border: 1.5px solid rgba(255, 255, 255, 0.1);
  border-top-color: var(--g1);
  animation: spin 0.9s linear infinite;
}
.ld-txt {
  font-family: var(--mono);
  font-size: 10px;
  color: var(--muted);
  letter-spacing: 0.2em;
  text-transform: uppercase;
}
.ld-txt em {
  font-style: normal;
  animation: blink 1s step-end infinite;
}
@keyframes spin {
  to {
    transform: rotate(360deg);
  }
}
@keyframes blink {
  0%, 100% {
    opacity: 1;
  }
  50% {
    opacity: 0;
  }
}

.err-box {
  text-align: center;
  color: var(--muted);
  padding: 28px 32px;
  border-radius: 28px;
  corner-shape: squircle;
}
.err-bang {
  font-size: 22px;
  margin-bottom: 12px;
  opacity: 0.55;
  color: var(--g2);
}
.err-msg {
  font-family: var(--mono);
  font-size: 11px;
  color: var(--text-sec);
}
.err-retry {
  margin-top: 16px;
  font-family: var(--mono);
  font-size: 10.5px;
  letter-spacing: 0.1em;
  text-transform: uppercase;
  padding: 6px 14px;
  border-radius: 100px;
  border: 1px solid var(--glass-border);
  color: var(--g1);
  background: rgba(93, 226, 255, 0.08);
  cursor: pointer;
  transition: border-color 0.18s ease, background-color 0.18s ease;
}
.err-retry:hover {
  border-color: rgba(93, 226, 255, 0.45);
  background: rgba(93, 226, 255, 0.15);
}

/* ──────────────────────────────────────────
   MAIN
────────────────────────────────────────── */
#main {
  display: flex;
  flex-direction: column;
  padding-top: 60px;
  padding-bottom: 100px;
}

/* ──────────────────────────────────────────
   HEADER CARD
────────────────────────────────────────── */
.hdr {
  margin-bottom: 24px;
  opacity: 0;
  animation: fu 0.7s ease forwards 0.05s;
}

.hdr-card {
  background: var(--glass);
  border: 1px solid var(--glass-border);
  border-radius: 34px;
  corner-shape: squircle;
  padding: 26px 26px 22px;
  backdrop-filter: blur(20px) saturate(1.4);
  -webkit-backdrop-filter: blur(20px) saturate(1.4);
  position: relative;
  overflow: hidden;
}
.hdr-card::before {
  content: '';
  position: absolute;
  top: 0;
  left: 10%;
  right: 10%;
  height: 1px;
  z-index: 3;
  background: linear-gradient(
    90deg,
    transparent,
    rgba(255, 255, 255, 0.72),
    rgba(220, 240, 255, 0.45),
    transparent
  );
}

.hdr-top {
  display: flex;
  align-items: flex-start;
  gap: 18px;
  margin-bottom: 14px;
}

.av-wrap {
  position: relative;
  flex-shrink: 0;
  padding: 2.5px;
  border-radius: 50%;
  background: linear-gradient(145deg, rgba(255, 255, 255, 0.72), rgba(180, 224, 255, 0.25) 55%, rgba(255, 255, 255, 0.42));
  box-shadow: 0 8px 24px rgba(0, 0, 0, 0.28);
}
.av-wrap img {
  width: 72px;
  height: 72px;
  border-radius: 50%;
  object-fit: cover;
  display: block;
  border: 2px solid rgba(5, 10, 24, 0.85);
  transition: transform 0.35s cubic-bezier(0.22, 1.2, 0.36, 1);
}
.av-wrap:hover img {
  transform: scale(1.04);
}

.status {
  position: absolute;
  bottom: 5px;
  right: 5px;
  width: 13px;
  height: 13px;
  background: #65e7ff;
  border: 2.5px solid rgba(3, 8, 22, 0.94);
  border-radius: 50%;
}
.status::after {
  content: '';
  position: absolute;
  inset: -5px;
  border-radius: 50%;
  background: #65e7ff;
  opacity: 0.2;
  animation: pop 2.4s ease-out infinite;
}
@keyframes pop {
  0% {
    transform: scale(0.7);
    opacity: 0.3;
  }
  100% {
    transform: scale(2.3);
    opacity: 0;
  }
}

.hdr-meta {
  flex: 1;
  min-width: 0;
}

.hdr-name {
  font-family: var(--font-display);
  font-size: 26px;
  font-weight: 700;
  letter-spacing: -0.025em;
  line-height: 1.15;
  margin-bottom: 4px;
  background: linear-gradient(180deg, #ffffff 30%, rgba(226, 240, 255, 0.88) 100%);
  -webkit-background-clip: text;
  -webkit-text-fill-color: transparent;
  background-clip: text;
}

.gh-link {
  display: inline-flex;
  align-items: center;
  gap: 5px;
  font-family: var(--font);
  font-size: 12.5px;
  font-weight: 500;
  color: rgba(215, 229, 248, 0.72);
  text-decoration: none;
  transition: color 0.18s;
  margin-bottom: 10px;
}
.gh-link:hover {
  color: #ffffff;
}

.hdr-tags {
  display: flex;
  gap: 6px;
  flex-wrap: wrap;
}
.hdr-tag {
  font-size: 11px;
  padding: 4px 11px;
  border-radius: 9999px;
  border: 1px solid rgba(255, 255, 255, 0.18);
  color: rgba(238, 246, 255, 0.88);
  background: rgba(255, 255, 255, 0.08);
  font-weight: 500;
  display: inline-flex;
  align-items: center;
}
.loc-ico {
  font-size: 9px;
  margin-right: 4px;
  opacity: 0.7;
}

.bio {
  font-size: 13.5px;
  font-weight: 400;
  line-height: 1.55;
  color: rgba(228, 238, 252, 0.84);
  margin: 14px 0 18px;
}

/* Stats */
.stats {
  display: grid;
  grid-template-columns: repeat(3, 1fr);
  gap: 10px;
}
.stat {
  background: rgba(255, 255, 255, 0.06);
  border: 1px solid var(--glass-border);
  border-radius: var(--r-sm);
  corner-shape: squircle;
  padding: 13px 15px;
  transition: background 0.2s, border-color 0.2s, transform 0.2s cubic-bezier(0.22, 1, 0.36, 1);
  cursor: default;
}
.stat:hover {
  background: rgba(255, 255, 255, 0.10);
  border-color: var(--glass-border-hover);
}
.stat-n {
  font-family: var(--font-display);
  font-size: 22px;
  font-weight: 700;
  font-variant-numeric: tabular-nums;
  letter-spacing: -0.02em;
  color: var(--text);
  line-height: 1.05;
  margin-bottom: 3px;
}
.stat-l {
  font-family: var(--font);
  font-size: 11px;
  font-weight: 500;
  color: rgba(206, 221, 244, 0.72);
  letter-spacing: 0.01em;
}

/* ──────────────────────────────────────────
   CONTROLS
────────────────────────────────────────── */
.controls {
  display: flex;
  flex-direction: column;
  gap: 10px;
  margin-bottom: 14px;
  opacity: 0;
  animation: fu 0.6s ease forwards 0.3s;
}
.search-wrap {
  position: relative;
}
.search-wrap i {
  position: absolute;
  left: 16px;
  top: 50%;
  transform: translateY(-50%);
  color: var(--muted);
  font-size: 12px;
  pointer-events: none;
  z-index: 4;
}
#search {
  width: 100%;
  background: var(--glass);
  border: 1px solid var(--glass-border);
  border-radius: 9999px;
  padding: 12px 42px 12px 42px;
  font-family: var(--font);
  font-size: 14px;
  font-weight: 400;
  color: var(--text);
  outline: none;
  transition: border-color 0.2s, background 0.2s, box-shadow 0.2s;
  backdrop-filter: blur(16px);
  -webkit-backdrop-filter: blur(16px);
}
#search::placeholder {
  color: rgba(206, 221, 244, 0.56);
}
#search:focus {
  border-color: rgba(255, 255, 255, 0.45);
}
.search-clear {
  position: absolute;
  right: 11px;
  top: 50%;
  transform: translateY(-50%);
  width: 24px;
  height: 24px;
  border-radius: 9999px;
  border: none;
  background: rgba(255, 255, 255, 0.2);
  color: rgba(255, 255, 255, 0.92);
  display: flex;
  align-items: center;
  justify-content: center;
  cursor: pointer;
  z-index: 4;
  transition: background-color 0.16s ease, transform 0.16s ease;
}
.search-clear:hover {
  background: rgba(255, 255, 255, 0.3);
}
.search-clear:active {
  transform: translateY(-50%) scale(0.9);
}

.ctrl-row {
  display: flex;
  align-items: center;
  justify-content: space-between;
  gap: 10px;
  flex-wrap: wrap;
}
.pills {
  display: flex;
  gap: 6px;
  flex-wrap: wrap;
}
.pill {
  font-family: var(--font);
  font-size: 12px;
  font-weight: 500;
  padding: 6px 14px;
  border-radius: 9999px;
  border: 1px solid var(--glass-border);
  background: transparent;
  color: rgba(226, 238, 255, 0.78);
  cursor: pointer;
  transition: transform 0.18s cubic-bezier(0.22, 1, 0.36, 1), border-color 0.18s, color 0.18s, background-color 0.18s;
  white-space: nowrap;
}
.pill:hover {
  border-color: rgba(255, 255, 255, 0.36);
  color: #ffffff;
}
.pill:active,
.mob-pill:active,
#sort-btn:active {
  transform: scale(0.95);
}
.pill.on {
  background: rgba(255, 255, 255, 0.22);
  border-color: rgba(255, 255, 255, 0.52);
  color: #ffffff;
}

.sort-wrap {
  display: flex;
  align-items: center;
  gap: 7px;
  flex-shrink: 0;
}
.sort-lbl {
  font-family: var(--font);
  font-size: 11.5px;
  font-weight: 500;
  color: rgba(200, 214, 238, 0.68);
  white-space: nowrap;
}
#sort-btn {
  font-family: var(--font);
  font-size: 12px;
  font-weight: 500;
  padding: 6px 14px;
  border-radius: var(--r-xs);
  border: 1px solid var(--glass-border);
  background: var(--glass);
  color: rgba(235, 245, 255, 0.9);
  cursor: pointer;
  transition: transform 0.18s cubic-bezier(0.22, 1, 0.36, 1), border-color 0.18s, color 0.18s;
  display: flex;
  align-items: center;
  gap: 6px;
  backdrop-filter: blur(10px);
}
#sort-btn:hover {
  border-color: rgba(255, 255, 255, 0.42);
  color: #ffffff;
}
#sort-btn i {
  font-size: 10px;
}

/* ──────────────────────────────────────────
   SECTION DIVIDER + COUNT
────────────────────────────────────────── */
.section-divider {
  display: flex;
  align-items: center;
  gap: 12px;
  margin-top: 4px;
  margin-bottom: 12px;
  padding: 0 4px;
  opacity: 0;
  animation: fu 0.5s ease forwards 0.44s;
}
.section-divider span {
  font-family: var(--font);
  font-size: 12.5px;
  font-weight: 600;
  letter-spacing: -0.01em;
  color: rgba(226, 238, 255, 0.78);
  white-space: nowrap;
}
.section-divider strong {
  color: #ffffff;
  font-weight: 600;
  font-variant-numeric: tabular-nums;
}
.div-line {
  flex: 1;
  height: 1px;
  background: linear-gradient(90deg, rgba(255, 255, 255, 0.18), rgba(255, 255, 255, 0.04));
}

/* ──────────────────────────────────────────
   PROJECT CARDS (iOS Grouped Glass Rows)
────────────────────────────────────────── */
#grid {
  display: flex;
  flex-direction: column;
  gap: 10px;
}

.card {
  display: flex;
  align-items: center;
  gap: 14px;
  background: var(--glass);
  border: 1px solid var(--glass-border);
  border-radius: var(--r);
  corner-shape: squircle;
  padding: 15px 17px;
  text-decoration: none;
  color: inherit;
  transition:
    border-color 0.28s ease,
    box-shadow 0.34s ease,
    transform 0.38s cubic-bezier(0.22, 1, 0.36, 1);
  position: relative;
  overflow: hidden;
  backdrop-filter: blur(18px) saturate(1.3);
  -webkit-backdrop-filter: blur(18px) saturate(1.3);
}
.card::before {
  content: '';
  position: absolute;
  inset: 0;
  z-index: 0;
  background: linear-gradient(105deg, transparent 24%, rgba(255, 255, 255, 0.09) 48%, transparent 72%);
  mix-blend-mode: screen;
  transform: translateX(-105%);
  transition: transform 0.68s cubic-bezier(0.2, 0.75, 0.25, 1);
}
.card:hover::before {
  transform: translateX(105%);
}
.card:hover {
  border-color: rgba(255, 255, 255, 0.36);
  transform: scale(1.007);
  box-shadow: 0 14px 36px rgba(0, 0, 0, 0.38);
}
.card:active {
  transform: scale(0.984);
}

.card.feat {
  border-color: rgba(255, 255, 255, 0.30);
}
.card.feat:hover {
  border-color: rgba(255, 255, 255, 0.48);
}

.c-ico {
  width: 46px;
  height: 46px;
  border-radius: var(--r-icon);
  corner-shape: squircle;
  border: 1px solid rgba(255, 255, 255, 0.24);
  background: linear-gradient(180deg, rgba(255, 255, 255, 0.14), rgba(255, 255, 255, 0.04));
  box-shadow: inset 0 1px 0 rgba(255, 255, 255, 0.32), 0 4px 12px rgba(0, 0, 0, 0.22);
  display: flex;
  align-items: center;
  justify-content: center;
  font-size: 19px;
  flex-shrink: 0;
  transition: border-color 0.2s, transform 0.22s cubic-bezier(0.22, 1.2, 0.36, 1);
}
.card:hover .c-ico {
  border-color: rgba(255, 255, 255, 0.42);
  transform: scale(1.03);
}

/* Language colors */
.lang-html { color: #e34c26; }
.lang-css { color: #7c5cfc; }
.lang-javascript { color: #f0cc50; }
.lang-typescript { color: #4facfe; }
.lang-python { color: #4b8bbe; }
.lang-java { color: #b07219; }
.lang-vue { color: #41b883; }
.lang-php { color: #818cf8; }
.lang-cpp { color: #f472b6; }
.lang-csharp { color: #34d399; }
.lang-react { color: #61dafb; }
.lang-default { color: #8fa3b0; }

.c-body {
  flex: 1;
  min-width: 0;
}
.c-nrow {
  display: flex;
  align-items: center;
  gap: 7px;
  margin-bottom: 4px;
  flex-wrap: wrap;
}
.c-name {
  font-family: var(--font-display);
  font-size: 15.5px;
  font-weight: 600;
  letter-spacing: -0.015em;
  color: var(--text);
  white-space: nowrap;
  overflow: hidden;
  text-overflow: ellipsis;
  transition: color 0.2s;
  max-width: 260px;
}
.card:hover .c-name {
  color: #ffffff;
}

.bdg {
  font-size: 9.5px;
  font-weight: 600;
  letter-spacing: 0.04em;
  padding: 2px 8px;
  border-radius: 9999px;
  flex-shrink: 0;
}
.bdg-feat {
  color: #e2f6ff;
  border: 1px solid rgba(255, 255, 255, 0.34);
  background: rgba(255, 255, 255, 0.14);
}
.bdg-new {
  color: #b7f7ff;
  border: 1px solid rgba(109, 234, 255, 0.40);
  background: rgba(109, 234, 255, 0.14);
}

.c-desc {
  font-size: 12.5px;
  font-weight: 400;
  color: rgba(212, 224, 245, 0.78);
  white-space: nowrap;
  overflow: hidden;
  text-overflow: ellipsis;
  line-height: 1.4;
}

.c-right {
  display: flex;
  flex-direction: column;
  align-items: flex-end;
  gap: 5px;
  flex-shrink: 0;
}
.c-lang {
  font-family: var(--font);
  font-size: 11px;
  font-weight: 500;
  color: rgba(206, 221, 244, 0.72);
  white-space: nowrap;
}
.c-time {
  font-family: var(--font);
  font-size: 10.5px;
  font-variant-numeric: tabular-nums;
  color: rgba(176, 194, 224, 0.65);
  white-space: nowrap;
}
.c-arr {
  width: 28px;
  height: 28px;
  border-radius: 9999px;
  border: 1px solid rgba(255, 255, 255, 0.18);
  display: flex;
  align-items: center;
  justify-content: center;
  color: rgba(226, 238, 255, 0.72);
  font-size: 10px;
  transition: all 0.2s ease;
}
.card:hover .c-arr {
  border-color: rgba(255, 255, 255, 0.45);
  color: #ffffff;
  background: rgba(255, 255, 255, 0.14);
}

/* ──────────────────────────────────────────
   EMPTY STATE & FOOTER
────────────────────────────────────────── */
.empty {
  text-align: center;
  padding: 52px 20px;
  border: 1px dashed var(--glass-border);
  border-radius: var(--r);
  corner-shape: squircle;
  color: var(--muted);
}
.empty p {
  font-size: 13px;
  margin-top: 8px;
}

footer {
  margin-top: 56px;
  padding-top: 20px;
  border-top: 1px solid var(--glass-border);
  display: flex;
  align-items: center;
  justify-content: space-between;
  opacity: 0;
  animation: fu 0.5s ease forwards 0.65s;
}
.ft-l {
  font-family: var(--font);
  font-size: 12px;
  font-weight: 500;
  color: rgba(196, 211, 236, 0.65);
}
.ft-r {
  display: flex;
  gap: 16px;
}
.ft-r a {
  color: var(--muted);
  font-size: 15px;
  text-decoration: none;
  transition: color 0.2s;
}
.ft-r a:hover {
  color: var(--text);
}

/* ──────────────────────────────────────────
   CUSTOM iOS LIQUID GLASS SCROLLBAR (Remastered)
────────────────────────────────────────── */
.ios-scrollbar-track {
  position: fixed;
  top: 16px;
  bottom: 16px;
  right: 12px;
  width: 34px;
  z-index: 100;
  display: flex;
  justify-content: center;
  pointer-events: none;
  opacity: 0;
  transition: opacity 0.28s ease;
}
.ios-scrollbar-track.visible {
  pointer-events: auto;
  opacity: 1;
}
.ios-scrollbar-rail {
  position: relative;
  width: 100%;
  height: 100%;
  display: flex;
  align-items: flex-start;
  justify-content: center;
  border-radius: 9999px;
  background: rgba(255, 255, 255, 0.025);
  border: 1px solid rgba(255, 255, 255, 0.06);
  box-shadow: inset 0 0 12px rgba(0, 0, 0, 0.22);
  transition:
    background-color 0.26s ease,
    border-color 0.26s ease,
    box-shadow 0.26s ease;
}
.ios-scrollbar-track:hover .ios-scrollbar-rail,
.ios-scrollbar-track.active .ios-scrollbar-rail,
.ios-scrollbar-track.dragging .ios-scrollbar-rail {
  background: rgba(255, 255, 255, 0.055);
  border-color: rgba(255, 255, 255, 0.13);
  box-shadow: inset 0 0 16px rgba(0, 0, 0, 0.28);
}
.ios-scrollbar-thumb {
  width: 22px;
  min-height: 58px;
  border-radius: 9999px;
  cursor: grab;
  opacity: 0.84;
  display: flex;
  align-items: center;
  justify-content: center;
  will-change: transform, width, opacity;
  touch-action: none;
  transition:
    width 0.26s cubic-bezier(0.22, 1.35, 0.36, 1),
    opacity 0.26s ease,
    border-color 0.22s ease,
    box-shadow 0.22s ease;
}
.ios-scrollbar-thumb.liquid-glass {
  background: linear-gradient(180deg, rgba(255, 255, 255, 0.30), rgba(205, 232, 255, 0.15)), rgba(14, 24, 48, 0.44);
  border: 1px solid rgba(235, 248, 255, 0.42);
  -webkit-backdrop-filter: blur(14px) saturate(1.75);
  backdrop-filter: blur(14px) saturate(1.75);
  box-shadow:
    0 8px 24px rgba(0, 0, 0, 0.36),
    inset 0 1px 0 rgba(255, 255, 255, 0.68);
}
.ios-scrollbar-track.active .ios-scrollbar-thumb,
.ios-scrollbar-track:hover .ios-scrollbar-thumb {
  opacity: 1;
}
.ios-scrollbar-track:hover .ios-scrollbar-thumb,
.ios-scrollbar-track.dragging .ios-scrollbar-thumb {
  width: 28px;
  opacity: 1;
}
.ios-scrollbar-track.dragging .ios-scrollbar-thumb {
  cursor: grabbing;
}
.ios-scrollbar-grip {
  position: relative;
  z-index: 2;
  display: flex;
  flex-direction: column;
  align-items: center;
  gap: 3px;
  pointer-events: none;
  opacity: 0.56;
  transition: opacity 0.22s ease, transform 0.22s ease;
}
.ios-scrollbar-grip i {
  display: block;
  width: 9px;
  height: 1.75px;
  border-radius: 9999px;
  background: rgba(255, 255, 255, 0.92);
  box-shadow: 0 1px 2px rgba(0, 0, 0, 0.4);
  transition: width 0.24s cubic-bezier(0.22, 1.3, 0.36, 1);
}
.ios-scrollbar-track:hover .ios-scrollbar-grip,
.ios-scrollbar-track.dragging .ios-scrollbar-grip {
  opacity: 0.92;
}
.ios-scrollbar-track:hover .ios-scrollbar-grip i,
.ios-scrollbar-track.dragging .ios-scrollbar-grip i {
  width: 12px;
}
html.ios-scrolling-drag,
html.ios-scrolling-drag * {
  user-select: none !important;
  cursor: grabbing !important;
}

@keyframes fu {
  from {
    opacity: 0;
    transform: translateY(14px);
  }
  to {
    opacity: 1;
    transform: translateY(0);
  }
}

/* ──────────────────────────────────────────
   GLASS SURFACES — CSS fallback vs WebGL2 1:1 Refraction
────────────────────────────────────────── */
.liquid-glass {
  position: relative;
  isolation: isolate;
  overflow: hidden;
  color: rgba(246, 250, 255, 0.96);
  background: rgba(7, 13, 30, 0.34);
  border: 1px solid rgba(235, 248, 255, 0.28);
  -webkit-backdrop-filter: blur(14px) saturate(1.65);
  backdrop-filter: blur(14px) saturate(1.65);
  box-shadow:
    0 14px 38px rgba(0, 0, 0, 0.28),
    0 2px 8px rgba(0, 0, 0, 0.16);
  transition:
    border-color 0.22s ease,
    box-shadow 0.25s ease,
    transform 0.22s cubic-bezier(0.2, 0.75, 0.25, 1);
}

.liquid-glass-soft {
  position: relative;
  isolation: isolate;
  overflow: hidden;
  background: rgba(9, 17, 36, 0.28);
  border-color: rgba(226, 242, 255, 0.24);
  transition: border-color 0.18s ease, color 0.18s ease, background-color 0.18s ease;
}

.c-ico.liquid-glass-soft {
  border-radius: var(--r-icon);
  corner-shape: squircle;
}
.c-arr.liquid-glass-soft {
  border-radius: 9999px;
}
.hdr-tag.liquid-glass-soft {
  color: rgba(230, 242, 255, 0.86);
  background: rgba(255, 255, 255, 0.06);
}
.pill.liquid-glass-soft {
  padding-top: 6px;
  padding-bottom: 6px;
}

/* When WebGL2 Liquid Glass canvas is active, let the optical refracted canvas
   directly render every panel's curved lens distortion without opaque CSS fog hiding it! */
html.lg-webgl-on .hdr-card.liquid-glass,
html.lg-webgl-on .card.liquid-glass,
html.lg-webgl-on .stat.liquid-glass,
html.lg-webgl-on #search.liquid-glass,
html.lg-webgl-on #sort-btn.liquid-glass,
html.lg-webgl-on .ios-scrollbar-thumb.liquid-glass,
html.lg-webgl-on .ios-dock.liquid-glass,
html.lg-webgl-on .ios-toast.liquid-glass,
html.lg-webgl-on .pill.liquid-glass-soft,
html.lg-webgl-on .c-ico.liquid-glass-soft,
html.lg-webgl-on .c-arr.liquid-glass-soft {
  background: transparent !important;
  -webkit-backdrop-filter: none !important;
  backdrop-filter: none !important;
  border-color: rgba(235, 248, 255, 0.14);
}
html.lg-webgl-on .ios-dock-tile.liquid-glass-soft {
  -webkit-backdrop-filter: none !important;
  backdrop-filter: none !important;
  border-color: rgba(255, 255, 255, 0.34);
}
html.lg-webgl-on .ios-dock-tile.tile-projects {
  background: linear-gradient(155deg, rgba(108, 226, 255, 0.30), rgba(52, 132, 255, 0.18)) !important;
}
html.lg-webgl-on .ios-dock-tile.tile-featured {
  background: linear-gradient(155deg, rgba(255, 214, 102, 0.30), rgba(255, 134, 92, 0.18)) !important;
}
html.lg-webgl-on .ios-dock-tile.tile-search {
  background: linear-gradient(155deg, rgba(176, 152, 255, 0.30), rgba(102, 126, 255, 0.18)) !important;
}
html.lg-webgl-on .ios-dock-tile.tile-filter {
  background: linear-gradient(155deg, rgba(94, 240, 210, 0.28), rgba(50, 180, 214, 0.18)) !important;
}
html.lg-webgl-on .ios-dock-tile.tile-share {
  background: linear-gradient(155deg, rgba(105, 195, 255, 0.30), rgba(56, 130, 246, 0.18)) !important;
}
html.lg-webgl-on .ios-dock-tile.tile-github {
  background: linear-gradient(155deg, rgba(255, 255, 255, 0.20), rgba(125, 148, 195, 0.12)) !important;
}
html.lg-webgl-on .ios-dock.liquid-glass {
  border-color: rgba(235, 248, 255, 0.24);
  box-shadow:
    0 20px 46px rgba(0, 0, 0, 0.44),
    0 2px 10px rgba(0, 0, 0, 0.22);
}
html.lg-webgl-on .ios-toast.liquid-glass {
  border-color: rgba(235, 248, 255, 0.28);
}
html.lg-webgl-on .ios-dock > *,
html.lg-webgl-on .ios-toast > * {
  position: relative;
  z-index: 1;
}
html.lg-webgl-on .ios-scrollbar-thumb.liquid-glass {
  border-color: rgba(238, 249, 255, 0.28);
  box-shadow: 0 6px 20px rgba(0, 0, 0, 0.34);
}
html.lg-webgl-on .ios-scrollbar-track:hover .ios-scrollbar-thumb.liquid-glass,
html.lg-webgl-on .ios-scrollbar-track.dragging .ios-scrollbar-thumb.liquid-glass {
  border-color: rgba(238, 249, 255, 0.44);
  box-shadow: 0 8px 24px rgba(0, 0, 0, 0.42), 0 0 14px rgba(109, 234, 255, 0.16);
}

html.lg-webgl-on .hdr-card.liquid-glass {
  border-color: rgba(235, 248, 255, 0.18);
  box-shadow:
    0 24px 60px rgba(0, 0, 0, 0.36),
    0 0 36px rgba(71, 211, 255, 0.09);
}
html.lg-webgl-on .card.liquid-glass:hover {
  border-color: rgba(235, 248, 255, 0.28);
}
html.lg-webgl-on .card.feat.liquid-glass {
  border-color: rgba(93, 226, 255, 0.26);
}
html.lg-webgl-on .card.feat.liquid-glass:hover {
  border-color: rgba(93, 226, 255, 0.44);
}
html.lg-webgl-on .hdr-card > * {
  position: relative;
  z-index: 1;
}
html.lg-webgl-on .card > * {
  position: relative;
  z-index: 1;
}

html.lg-webgl-on .pill.liquid-glass-soft.on {
  background: rgba(255, 255, 255, 0.24) !important;
  border-color: rgba(255, 255, 255, 0.56);
  color: #ffffff;
  box-shadow:
    0 4px 16px rgba(0, 0, 0, 0.22),
    inset 0 1px 0 rgba(255, 255, 255, 0.65);
}

html.lg-webgl-on #search.liquid-glass:focus {
  border-color: rgba(255, 255, 255, 0.52);
  box-shadow: 0 0 0 3px rgba(255, 255, 255, 0.12), 0 8px 24px rgba(0, 0, 0, 0.24);
}

.pill.on {
  color: #ffffff;
  border-color: rgba(255, 255, 255, 0.54);
  background: rgba(255, 255, 255, 0.24);
  box-shadow: inset 0 1px 0 rgba(255, 255, 255, 0.58), 0 4px 14px rgba(0, 0, 0, 0.20);
}

/* ──────────────────────────────────────────
   iOS DYNAMIC ISLAND TOAST PILL
────────────────────────────────────────── */
.ios-toast-wrap {
  position: fixed;
  top: max(14px, env(safe-area-inset-top, 0px));
  left: 50%;
  transform: translateX(-50%);
  z-index: 110;
  pointer-events: none;
}

@keyframes toastIn {
  from {
    opacity: 0;
    transform: translateY(-12px) scale(0.92);
  }
  to {
    opacity: 1;
    transform: translateY(0) scale(1);
  }
}

.ios-toast {
  display: inline-flex;
  align-items: center;
  gap: 8px;
  padding: 8px 16px 8px 10px;
  border-radius: 9999px;
  font-family: var(--font);
  font-size: 13px;
  font-weight: 600;
  letter-spacing: -0.01em;
  color: #ffffff;
  white-space: nowrap;
  animation: toastIn 0.24s cubic-bezier(0.22, 1.35, 0.36, 1);
  box-shadow:
    0 14px 36px rgba(0, 0, 0, 0.45),
    inset 0 1px 0 rgba(255, 255, 255, 0.56);
}

.ios-toast-ico {
  width: 22px;
  height: 22px;
  border-radius: 50%;
  background: rgba(109, 234, 255, 0.24);
  border: 1px solid rgba(109, 234, 255, 0.52);
  color: #8af0ff;
  display: inline-flex;
  align-items: center;
  justify-content: center;
}

/* ──────────────────────────────────────────
   iOS LIQUID GLASS APP DOCK (Mobile & Tablet)
────────────────────────────────────────── */
.ios-dock-wrap {
  display: none;
  position: fixed;
  left: 0;
  right: 0;
  bottom: max(10px, env(safe-area-inset-bottom, 0px));
  z-index: 100;
  justify-content: center;
  padding: 0 12px;
  pointer-events: none;
}

.ios-dock {
  pointer-events: auto;
  display: inline-flex;
  align-items: center;
  gap: 5px;
  padding: 6px 10px 5px;
  border-radius: 28px;
  corner-shape: squircle;
  background:
    linear-gradient(
      180deg,
      rgba(255, 255, 255, 0.18) 0%,
      rgba(255, 255, 255, 0.04) 48%,
      rgba(255, 255, 255, 0.09) 100%
    ),
    rgba(8, 15, 32, 0.56);
  border: 1px solid rgba(235, 248, 255, 0.34);
  -webkit-backdrop-filter: blur(26px) saturate(1.9);
  backdrop-filter: blur(26px) saturate(1.9);
  box-shadow:
    0 18px 44px rgba(0, 0, 0, 0.48),
    0 2px 10px rgba(0, 0, 0, 0.24),
    inset 0 1px 0 rgba(255, 255, 255, 0.65),
    inset 0 -1px 0 rgba(255, 255, 255, 0.16);
}

.ios-dock-item {
  position: relative;
  min-width: 46px;
  min-height: 48px;
  display: flex;
  flex-direction: column;
  align-items: center;
  justify-content: center;
  gap: 3px;
  padding: 1px 3px;
  background: transparent;
  border: none;
  color: inherit;
  text-decoration: none;
  cursor: pointer;
  -webkit-tap-highlight-color: transparent;
  transition: transform 0.2s cubic-bezier(0.22, 1.35, 0.36, 1);
}
.ios-dock-item:active {
  transform: scale(0.88);
}

.ios-dock-tile {
  position: relative;
  overflow: visible;
  width: 40px;
  height: 40px;
  border-radius: 13px;
  corner-shape: squircle;
  display: flex;
  align-items: center;
  justify-content: center;
  color: #ffffff;
  font-size: 19px;
  border: 1px solid rgba(255, 255, 255, 0.34);
  box-shadow:
    0 6px 14px rgba(0, 0, 0, 0.28),
    inset 0 1px 0 rgba(255, 255, 255, 0.58);
  transition:
    transform 0.24s cubic-bezier(0.22, 1.35, 0.36, 1),
    border-color 0.2s ease,
    box-shadow 0.2s ease;
}

.tile-projects {
  background: linear-gradient(155deg, rgba(108, 226, 255, 0.46), rgba(52, 132, 255, 0.28));
}
.tile-featured {
  background: linear-gradient(155deg, rgba(255, 214, 102, 0.46), rgba(255, 134, 92, 0.28));
}
.tile-search {
  background: linear-gradient(155deg, rgba(176, 152, 255, 0.46), rgba(102, 126, 255, 0.28));
}
.tile-filter {
  background: linear-gradient(155deg, rgba(94, 240, 210, 0.44), rgba(50, 180, 214, 0.28));
}
.tile-share {
  background: linear-gradient(155deg, rgba(105, 195, 255, 0.44), rgba(56, 130, 246, 0.28));
}
.tile-github {
  background: linear-gradient(155deg, rgba(255, 255, 255, 0.26), rgba(125, 148, 195, 0.16));
}

.ios-dock-item.on .ios-dock-tile {
  transform: translateY(-2px) scale(1.06);
  border-color: rgba(255, 255, 255, 0.78);
  box-shadow:
    0 8px 20px rgba(0, 0, 0, 0.36),
    0 0 16px rgba(255, 255, 255, 0.22),
    inset 0 1px 0 rgba(255, 255, 255, 0.78);
}

.ios-dock-lbl {
  font-family: var(--font);
  font-size: 9.5px;
  font-weight: 500;
  color: rgba(226, 238, 255, 0.78);
  letter-spacing: -0.01em;
  line-height: 1;
  transition: color 0.18s ease;
}
.ios-dock-item.on .ios-dock-lbl {
  color: #ffffff;
  font-weight: 600;
}

.ios-dock-dot {
  width: 4px;
  height: 4px;
  border-radius: 50%;
  background: #ffffff;
  box-shadow: 0 0 8px rgba(255, 255, 255, 0.9);
  opacity: 0;
  transform: scale(0.4);
  transition: opacity 0.2s ease, transform 0.2s ease;
}
.ios-dock-item.on .ios-dock-dot {
  opacity: 1;
  transform: scale(1);
}

.ios-dock-badge {
  position: absolute;
  top: -3px;
  right: -3px;
  width: 9px;
  height: 9px;
  border-radius: 50%;
  background: #6deaff;
  border: 1.5px solid rgba(8, 15, 32, 0.9);
  box-shadow: 0 0 8px rgba(109, 234, 255, 0.8);
}

.ios-dock-sep {
  width: 1px;
  height: 34px;
  margin: 0 3px;
  flex-shrink: 0;
  background: linear-gradient(180deg, transparent, rgba(255, 255, 255, 0.30), transparent);
}

/* ──────────────────────────────────────────
   iOS FILTER & SORT BOTTOM SHEET
────────────────────────────────────────── */
.ios-sheet-backdrop {
  position: fixed;
  inset: 0;
  z-index: 120;
  background: rgba(3, 7, 20, 0.56);
  -webkit-backdrop-filter: blur(6px);
  backdrop-filter: blur(6px);
  display: flex;
  align-items: flex-end;
  justify-content: center;
  padding: 16px 14px calc(16px + env(safe-area-inset-bottom, 0px));
  animation: fadeIn 0.2s ease;
}

@keyframes fadeIn {
  from { opacity: 0; }
  to { opacity: 1; }
}

@keyframes sheetSlideUp {
  from {
    opacity: 0;
    transform: translateY(24px) scale(0.97);
  }
  to {
    opacity: 1;
    transform: translateY(0) scale(1);
  }
}

.ios-sheet {
  width: 100%;
  max-width: 520px;
  border-radius: 32px;
  corner-shape: squircle;
  padding: 10px 20px 20px;
  background:
    linear-gradient(180deg, rgba(255, 255, 255, 0.16), rgba(255, 255, 255, 0.04) 40%),
    rgba(9, 17, 36, 0.82);
  border: 1px solid rgba(235, 248, 255, 0.32);
  -webkit-backdrop-filter: blur(22px) saturate(1.85);
  backdrop-filter: blur(22px) saturate(1.85);
  box-shadow:
    0 24px 64px rgba(0, 0, 0, 0.62),
    inset 0 1px 0 rgba(255, 255, 255, 0.58);
  animation: sheetSlideUp 0.28s cubic-bezier(0.22, 1.2, 0.36, 1);
}

.ios-sheet-handle {
  width: 38px;
  height: 4px;
  border-radius: 9999px;
  background: rgba(255, 255, 255, 0.36);
  margin: 0 auto 14px;
}

.ios-sheet-hdr {
  display: flex;
  align-items: center;
  justify-content: space-between;
  margin-bottom: 16px;
}
.ios-sheet-title {
  font-family: var(--font-display);
  font-size: 18px;
  font-weight: 700;
  letter-spacing: -0.02em;
  color: #ffffff;
}
.ios-sheet-close {
  width: 34px;
  height: 34px;
  min-width: 44px;
  min-height: 44px;
  margin: -5px;
  border-radius: 9999px;
  border: none;
  background: transparent;
  color: rgba(226, 238, 255, 0.82);
  display: flex;
  align-items: center;
  justify-content: center;
  cursor: pointer;
}

.ios-sheet-section {
  margin-bottom: 16px;
}
.ios-sheet-lbl {
  font-family: var(--font);
  font-size: 12px;
  font-weight: 600;
  color: rgba(206, 221, 244, 0.72);
  margin-bottom: 8px;
}

.ios-segmented {
  display: grid;
  grid-template-columns: repeat(2, 1fr);
  gap: 6px;
  padding: 4px;
  border-radius: 9999px;
  background: rgba(255, 255, 255, 0.06);
  border: 1px solid rgba(255, 255, 255, 0.14);
}
.ios-seg-btn {
  min-height: 40px;
  border-radius: 9999px;
  border: 1px solid transparent;
  background: transparent;
  color: rgba(226, 238, 255, 0.76);
  font-family: var(--font);
  font-size: 13px;
  font-weight: 600;
  display: flex;
  align-items: center;
  justify-content: center;
  gap: 6px;
  cursor: pointer;
  transition: all 0.18s ease;
}
.ios-seg-btn.on {
  color: #ffffff;
  background: rgba(255, 255, 255, 0.22);
  border-color: rgba(255, 255, 255, 0.45);
  box-shadow: inset 0 1px 0 rgba(255, 255, 255, 0.52), 0 4px 12px rgba(0, 0, 0, 0.22);
}

.ios-sheet-chips {
  display: flex;
  flex-wrap: wrap;
  gap: 8px;
}
.ios-sheet-chip {
  min-height: 42px;
  padding: 8px 16px;
  border-radius: 9999px;
  border: 1px solid rgba(255, 255, 255, 0.18);
  background: rgba(255, 255, 255, 0.06);
  color: rgba(230, 240, 255, 0.85);
  font-family: var(--font);
  font-size: 13px;
  font-weight: 500;
  display: inline-flex;
  align-items: center;
  gap: 6px;
  cursor: pointer;
  transition: transform 0.16s ease, background-color 0.18s ease, border-color 0.18s ease;
}
.ios-sheet-chip:active,
.ios-sheet-done:active {
  transform: scale(0.96);
}
.ios-sheet-chip.on {
  color: #ffffff;
  background: rgba(255, 255, 255, 0.24);
  border-color: rgba(255, 255, 255, 0.56);
  box-shadow: inset 0 1px 0 rgba(255, 255, 255, 0.58), 0 4px 14px rgba(0, 0, 0, 0.24);
}

.ios-sheet-done {
  width: 100%;
  min-height: 46px;
  margin-top: 6px;
  border-radius: 9999px;
  border: 1px solid rgba(255, 255, 255, 0.52);
  background: rgba(255, 255, 255, 0.22);
  color: #ffffff;
  font-family: var(--font);
  font-size: 14px;
  font-weight: 600;
  cursor: pointer;
  box-shadow: inset 0 1px 0 rgba(255, 255, 255, 0.64), 0 8px 20px rgba(0, 0, 0, 0.28);
  transition: transform 0.16s ease, background-color 0.18s ease;
}

.pill:focus-visible,
#sort-btn:focus-visible,
#search:focus-visible,
.card:focus-visible,
.gh-link:focus-visible,
.ft-r a:focus-visible,
.err-retry:focus-visible,
.ios-dock-item:focus-visible,
.ios-sheet-close:focus-visible,
.ios-seg-btn:focus-visible,
.ios-sheet-chip:focus-visible,
.ios-sheet-done:focus-visible {
  outline: 2px solid rgba(109, 234, 255, 0.84);
  outline-offset: 3px;
}

/* ══════════════════════════════════════════
   RESPONSIVE BREAKPOINTS (Tablet & Mobile)
══════════════════════════════════════════ */
@media (max-width: 1024px) {
  .ios-dock-wrap {
    display: flex;
  }

  .page {
    max-width: 760px;
    padding: 0 54px 0 26px;
  }

  #main {
    padding-top: calc(44px + env(safe-area-inset-top, 0px));
    padding-bottom: calc(118px + env(safe-area-inset-bottom, 0px));
  }

  .pill,
  #sort-btn {
    min-height: 40px;
    padding-left: 16px;
    padding-right: 16px;
  }

  .ios-scrollbar-track {
    right: 8px;
    top: calc(14px + env(safe-area-inset-top, 0px));
    bottom: calc(98px + env(safe-area-inset-bottom, 0px));
  }
}

@media (max-width: 600px) {
  .page {
    padding: 0 40px 0 14px;
  }
  #main {
    padding-top: calc(28px + env(safe-area-inset-top, 0px));
    padding-bottom: calc(108px + env(safe-area-inset-bottom, 0px));
  }

  .hdr-card {
    padding: 22px 18px 20px;
    border-radius: 30px;
  }
  .hdr-top {
    flex-direction: column;
    align-items: center;
    text-align: center;
    gap: 14px;
  }
  .hdr-meta {
    width: 100%;
    display: flex;
    flex-direction: column;
    align-items: center;
  }
  .hdr-name {
    font-size: 23px;
  }
  .hdr-tags {
    justify-content: center;
  }
  .gh-link {
    margin-bottom: 8px;
    min-height: 36px;
  }
  .bio {
    text-align: center;
    margin: 12px 0 16px;
    font-size: 13px;
  }

  .av-wrap img {
    width: 80px;
    height: 80px;
  }

  .stats {
    gap: 8px;
  }
  .stat {
    padding: 11px 10px;
    border-radius: 18px;
  }
  .stat-n {
    font-size: 20px;
  }

  .pills {
    display: none;
  }
  .ctrl-row {
    justify-content: flex-end;
  }
  #search {
    min-height: 44px;
    font-size: 15px;
    padding: 11px 42px 11px 42px;
    border-radius: 9999px;
  }
  #sort-btn {
    min-height: 42px;
  }

  .card {
    padding: 14px 15px;
    gap: 12px;
    border-radius: 24px;
  }
  .c-ico {
    width: 42px;
    height: 42px;
    font-size: 17px;
    border-radius: 12px;
  }
  .c-name {
    font-size: 14.5px;
    max-width: 175px;
  }
  .c-desc {
    display: none;
  }
  .c-time {
    display: none;
  }
  .c-lang {
    font-size: 10.5px;
  }

  .ios-scrollbar-track {
    right: 4px;
    top: calc(12px + env(safe-area-inset-top, 0px));
    bottom: calc(94px + env(safe-area-inset-bottom, 0px));
    width: 28px;
  }
  .ios-scrollbar-thumb {
    width: 18px;
  }
  .ios-scrollbar-track:hover .ios-scrollbar-thumb,
  .ios-scrollbar-track.dragging .ios-scrollbar-thumb {
    width: 22px;
  }
}

@media (max-width: 390px) {
  .stat-n {
    font-size: 17px;
  }
  .c-name {
    max-width: 140px;
  }
  .hdr-name {
    font-size: 20px;
  }
  .ios-dock {
    gap: 2px;
    padding: 6px 7px 5px;
  }
  .ios-dock-item {
    min-width: 42px;
    padding: 1px 2px;
  }
  .ios-dock-tile {
    width: 36px;
    height: 36px;
    font-size: 17px;
  }
}

@media (hover: none) {
  .card:hover {
    transform: none;
  }
  .card:hover .c-ico {
    transform: none;
  }
  .av-wrap:hover img {
    transform: none;
  }
}

@media (prefers-reduced-transparency: reduce) {
  .lg-webgl-canvas,
  .lg-webgl-overlay-canvas {
    display: none !important;
  }
  .liquid-glass,
  .liquid-glass-soft,
  .ios-dock,
  .ios-sheet,
  .ios-toast {
    -webkit-backdrop-filter: none !important;
    backdrop-filter: none !important;
    background: rgba(8, 15, 31, 0.92) !important;
  }
}

@media (prefers-reduced-motion: reduce) {
  *,
  *::before,
  *::after {
    animation-duration: 0.01ms !important;
    animation-iteration-count: 1 !important;
    transition-duration: 0.01ms !important;
    scroll-behavior: auto !important;
  }
}

        const VERTEX_SHADER = `#version 300 es
precision highp float;
in vec2 aUnitPos;
uniform vec2 uResolution;
uniform vec4 uRect;
out vec2 vLocalPos;
out vec2 vScreenPx;
void main() {
  vec2 halfSize = uRect.zw * 0.5;
  vec2 center = uRect.xy + halfSize;
  vec2 localPx = aUnitPos * (halfSize + vec2(2.0));
  vec2 screenPx = center + localPx;
  vec2 ndc = (screenPx / uResolution) * 2.0 - 1.0;
  ndc.y = -ndc.y;
  vLocalPos = localPx;
  vScreenPx = screenPx;
  gl_Position = vec4(ndc, 0.0, 1.0);
}`;

        const FRAGMENT_SHADER = `#version 300 es
precision highp float;
in vec2 vLocalPos;
in vec2 vScreenPx;
uniform sampler2D uCityTex;
uniform vec2 uResolution;
uniform vec2 uImageSize;
uniform vec2 uHalfSize;
uniform float uRadius;
uniform float uBezel;
uniform float uRefract;
uniform float uWater;
uniform float uBlur;
uniform float uTime;
uniform float uBgZoom;
uniform float uParallaxY;
uniform vec4 uTint;
uniform vec2 uMouseLocal;
uniform float uHover;
uniform float uFeatured;
uniform float uLayer;
uniform float uOpacity;
out vec4 fragColor;

float sdRoundedBox(vec2 p, vec2 b, float r) {
  float minHalf = min(b.x, b.y);
  float isCapsule = smoothstep(minHalf * 0.86, minHalf * 0.98, r);
  float effR = mix(min(r * 1.16, minHalf), r, isCapsule);
  vec2 q = abs(p) - b + vec2(effR);
  vec2 posQ = max(q, vec2(0.0001));
  float k = mix(2.65, 2.0, isCapsule);
  float cornerDist = (q.x > 0.0 || q.y > 0.0)
    ? pow(pow(posQ.x, k) + pow(posQ.y, k), 1.0 / k)
    : 0.0;
  return min(max(q.x, q.y), 0.0) + cornerDist - effR;
}

vec2 getOutwardNormal(vec2 p, vec2 b, float r) {
  float eps = min(1.5, min(b.x, b.y) * 0.35);
  float dx = sdRoundedBox(p + vec2(eps, 0.0), b, r) - sdRoundedBox(p - vec2(eps, 0.0), b, r);
  float dy = sdRoundedBox(p + vec2(0.0, eps), b, r) - sdRoundedBox(p - vec2(0.0, eps), b, r);
  vec2 g = vec2(dx, dy);
  float len = length(g);
  return len > 0.0001 ? g / len : vec2(0.0, -1.0);
}

vec2 screenPxToCityUv(vec2 px) {
  vec2 centered = (px - uResolution * 0.5 - vec2(0.0, uParallaxY)) / max(uBgZoom, 1.0) + uResolution * 0.5;
  vec2 suv = clamp(centered / uResolution, vec2(0.001), vec2(0.999));
  float viewAspect = uResolution.x / max(uResolution.y, 1.0);
  float imgAspect = uImageSize.x / max(uImageSize.y, 1.0);
  vec2 scale = viewAspect > imgAspect
    ? vec2(1.0, imgAspect / viewAspect)
    : vec2(viewAspect / imgAspect, 1.0);
  return (suv - 0.5) * scale + 0.5;
}

vec3 gradeCitySample(vec3 col, vec2 rawScreenPx) {
  vec2 suv = clamp(rawScreenPx / uResolution, vec2(0.0), vec2(1.0));
  float luma = dot(col, vec3(0.2126, 0.7152, 0.0722));
  col = mix(vec3(luma), col, 1.38);
  col = (col - 0.5) * 1.05 + 0.5;

        function renderSheet() {
          sheetHost.innerHTML = '';
          if (!state.sheetOpen) return;

          const backdrop = el('div', 'ios-sheet-backdrop');
          backdrop.setAttribute('role', 'dialog');
          backdrop.setAttribute('aria-modal', 'true');
          backdrop.setAttribute('aria-label', 'Filter and sort projects');
          backdrop.addEventListener('click', () => {
            state.sheetOpen = false;
            renderSheet();
            renderDock();
          });

          const sheet = el('div', 'ios-sheet');
          sheet.addEventListener('click', (e) => e.stopPropagation());

          let dragStartY = null;
          let dragY = 0;
          sheet.addEventListener('touchstart', (e) => {
            if (e.touches.length === 1) dragStartY = e.touches[0].clientY;
          }, { passive: true });
          sheet.addEventListener('touchmove', (e) => {
            if (dragStartY === null || e.touches.length !== 1) return;
            const dy = e.touches[0].clientY - dragStartY;
            dragY = dy > 0 ? dy : dy * 0.18;
            sheet.style.transition = 'none';
            sheet.style.transform = `translate3d(0, ${dragY.toFixed(1)}px, 0)`;
          }, { passive: true });
          sheet.addEventListener('touchend', () => {
            if (dragY > 82) {
              state.sheetOpen = false;
              renderSheet();
              renderDock();
            } else {
              sheet.style.transition = '';
              sheet.style.transform = '';
            }
            dragStartY = null;
            dragY = 0;
          });

          const handle = el('div', 'ios-sheet-handle');
          handle.setAttribute('aria-hidden', 'true');

          const hdr = el('div', 'ios-sheet-hdr');
          hdr.append(el('span', 'ios-sheet-title', 'Filter & Sort'));
          const closeBtn = el('button', 'ios-sheet-close');
          closeBtn.type = 'button';
          closeBtn.setAttribute('aria-label', 'Close filter sheet');
          closeBtn.append(ICONS.x(16, 2.2));
          closeBtn.addEventListener('click', () => {
            state.sheetOpen = false;
            renderSheet();
            renderDock();
          });
          hdr.append(closeBtn);

          // Sort Order
          const sortSec = el('div', 'ios-sheet-section');
          sortSec.append(el('div', 'ios-sheet-lbl', 'Sort Order'));
          const seg = el('div', 'ios-segmented');
          const newestBtn = el('button', `ios-seg-btn${state.sortDir === 'desc' ? ' on' : ''}`);
          newestBtn.type = 'button';
          newestBtn.append(ICONS.sortDesc(15, 2), el('span', '', 'Newest'));
          newestBtn.addEventListener('click', () => { state.sortDir = 'desc'; syncControlsAndList(); renderSheet(); });
          const oldestBtn = el('button', `ios-seg-btn${state.sortDir === 'asc' ? ' on' : ''}`);
          oldestBtn.type = 'button';
          oldestBtn.append(ICONS.sortAsc(15, 2), el('span', '', 'Oldest'));
          oldestBtn.addEventListener('click', () => { state.sortDir = 'asc'; syncControlsAndList(); renderSheet(); });
          seg.append(newestBtn, oldestBtn);
          sortSec.append(seg);

          // Collection
          const colSec = el('div', 'ios-sheet-section');
          colSec.append(el('div', 'ios-sheet-lbl', 'Collection'));
          const colChips = el('div', 'ios-sheet-chips');
          const allChip = el('button', `ios-sheet-chip${!state.featuredOnly ? ' on' : ''}`);
          allChip.type = 'button';
          if (!state.featuredOnly) allChip.append(ICONS.check(13, 2.4));
          allChip.append(el('span', '', 'All Repos'));
          allChip.addEventListener('click', () => { if (state.featuredOnly) toggleFeatured(); renderSheet(); });
          const featChip = el('button', `ios-sheet-chip${state.featuredOnly ? ' on' : ''}`);
          featChip.type = 'button';
          if (state.featuredOnly) featChip.append(ICONS.check(13, 2.4));
          featChip.append(el('span', '', 'Featured Only'));
          featChip.addEventListener('click', () => { if (!state.featuredOnly) toggleFeatured(); renderSheet(); });
          colChips.append(allChip, featChip);
          colSec.append(colChips);

          // Language
          const langSec = el('div', 'ios-sheet-section');
          langSec.append(el('div', 'ios-sheet-lbl', 'Language'));
          const langChips = el('div', 'ios-sheet-chips');
          for (const lang of getLanguages()) {
            const isOn = state.langFilter === lang;
            const chip = el('button', `ios-sheet-chip${isOn ? ' on' : ''}`);
            chip.type = 'button';
            if (isOn) chip.append(ICONS.check(13, 2.4));
            chip.append(el('span', '', lang === 'all' ? 'All' : lang));
            chip.addEventListener('click', () => {
              state.langFilter = lang;
              syncControlsAndList();
              renderSheet();
            });
            langChips.append(chip);
          }
          langSec.append(langChips);

          const doneBtn = el('button', 'ios-sheet-done', 'Done');
          doneBtn.type = 'button';
          doneBtn.addEventListener('click', () => {
            state.sheetOpen = false;
            renderSheet();
            renderDock();
          });

          sheet.append(handle, hdr, sortSec, colSec, langSec, doneBtn);
          backdrop.append(sheet);
          sheetHost.append(backdrop);
        }

        window.addEventListener('keydown', (e) => {
          if (e.key === 'Escape' && state.sheetOpen) {
            state.sheetOpen = false;
            renderSheet();
            renderDock();
          }
        });

        function syncControlsAndList() {
          if (searchClearBtn) {
            searchClearBtn.style.display = state.query.length > 0 ? 'flex' : 'none';
          }
          if (sortTxtEl && sortIcoEl) {
            sortTxtEl.textContent = state.sortDir === 'desc' ? 'Newest' : 'Oldest';
            sortIcoEl.className = `fa-solid ${state.sortDir === 'desc' ? 'fa-arrow-down-wide-short' : 'fa-arrow-up-wide-short'}`;
          }
          renderPills();
          renderGrid();
          renderDock();
          scheduleSbSync();
        }

        function renderPage() {
          dynamicGlassCleanups.forEach((fn) => fn());
          dynamicGlassCleanups = [];
          cardCleanups.forEach((fn) => fn());
          cardCleanups = [];
          pageEl.innerHTML = '';

          if (state.loading || state.error) {
            const loader = el('div');
            loader.id = 'loader';
            if (state.loading) {
              const txt = el('p', 'ld-txt', 'Loading projects');
              txt.append(el('em', '', '_'));
              loader.append(el('div', 'ld-ring'), txt);
            } else {
              const errBox = el('div', 'err-box liquid-glass');
              const retryBtn = el('button', 'err-retry', 'Retry');
              retryBtn.type = 'button';
              retryBtn.addEventListener('click', loadData);
              errBox.append(el('div', 'err-bang', '!'), el('p', 'err-msg', state.error), retryBtn);
              loader.append(errBox);
            }
            pageEl.append(loader);
            renderDock();
            return;
          }

          const u = state.user;
          const main = el('div');
          main.id = 'main';

          // Header
          const hdr = el('header', 'hdr');
          const hdrCard = el('div', 'hdr-card liquid-glass');
          dynamicGlassCleanups.push(registerGlass(hdrCard, { preset: 'hero', trackPointer: true }));

          const hdrTop = el('div', 'hdr-top');
          const avWrap = el('div', 'av-wrap');
          const avImg = el('img');
          avImg.id = 'av';
          avImg.src = u.avatar_url;
          avImg.alt = `${u.name || u.login} avatar`;
          avWrap.append(avImg, el('div', 'status'));

          const hdrMeta = el('div', 'hdr-meta');
          const uname = el('h1', 'hdr-name', u.name || u.login);
          uname.id = 'uname';

          const ghLink = el('a', 'gh-link');
          ghLink.id = 'ghlink';
          ghLink.href = u.html_url;
          ghLink.target = '_blank';
          ghLink.rel = 'noopener noreferrer';
          const ghIcon = el('i', 'fa-brands fa-github');
          ghIcon.setAttribute('aria-hidden', 'true');
          const loginSpan = el('span', '', `@${u.login}`);
          loginSpan.id = 'login';
          ghLink.append(ghIcon, loginSpan);

          const hdrTags = el('div', 'hdr-tags');
          hdrTags.id = 'hdr-tags';
          if (u.location) {
            const locTag = el('span', 'hdr-tag liquid-glass-soft');
            const locIco = el('i', 'fa-solid fa-location-dot loc-ico');
            locIco.setAttribute('aria-hidden', 'true');
            locTag.append(locIco, document.createTextNode(u.location));
            hdrTags.append(locTag);
          }
          if (u.company) {
            hdrTags.append(el('span', 'hdr-tag liquid-glass-soft', u.company));
          }

          hdrMeta.append(uname, ghLink, hdrTags);
          hdrTop.append(avWrap, hdrMeta);

          const bioEl = el('p', 'bio', u.bio || 'Building digital experiences.');
          bioEl.id = 'bio';

          const statsEl = el('div', 'stats');
          const statSpecs = [
            ['s-repos', u.public_repos, 'Repos'],
            ['s-live', state.repos.length, 'Live'],
            ['s-followers', u.followers, 'Followers'],
          ];
          for (const [sid, val, label] of statSpecs) {
            const box = el('div', 'stat liquid-glass');
            const num = el('div', 'stat-n', String(val));
            num.id = sid;
            box.append(num, el('div', 'stat-l', label));
            statsEl.append(box);
            dynamicGlassCleanups.push(registerGlass(box, { preset: 'stat' }));
          }

          hdrCard.append(hdrTop, bioEl, statsEl);
          hdr.append(hdrCard);

          // Controls
          const controls = el('div', 'controls');
          const searchWrap = el('div', 'search-wrap');
          const searchGlyph = el('i', 'fa-solid fa-magnifying-glass');
          searchGlyph.setAttribute('aria-hidden', 'true');

          searchInputEl = el('input', 'liquid-glass');
          searchInputEl.id = 'search';
          searchInputEl.type = 'text';
          searchInputEl.placeholder = 'Search projects…';
          searchInputEl.autocomplete = 'off';
          searchInputEl.value = state.query;
          searchInputEl.setAttribute('aria-label', 'Search projects');
          dynamicGlassCleanups.push(registerGlass(searchInputEl, { preset: 'search', trackPointer: true }));

          searchClearBtn = el('button', 'search-clear');
          searchClearBtn.type = 'button';
          searchClearBtn.setAttribute('aria-label', 'Clear search');
          searchClearBtn.append(ICONS.x(12, 2.4));
          searchClearBtn.style.display = state.query.length > 0 ? 'flex' : 'none';
          searchClearBtn.addEventListener('click', () => {
            state.query = '';
            searchInputEl.value = '';
            searchInputEl.focus();
            syncControlsAndList();
          });

          searchInputEl.addEventListener('input', (e) => {
            state.query = e.target.value;
            syncControlsAndList();
          });

          searchWrap.append(searchGlyph, searchInputEl, searchClearBtn);

          const ctrlRow = el('div', 'ctrl-row');
          pillsEl = el('div', 'pills');
          pillsEl.id = 'pills';

          const sortWrap = el('div', 'sort-wrap');
          sortWrap.append(el('span', 'sort-lbl', 'Sort'));
          const sortBtn = el('button', 'liquid-glass');
          sortBtn.id = 'sort-btn';
          sortBtn.type = 'button';
          sortTxtEl = el('span', '', state.sortDir === 'desc' ? 'Newest' : 'Oldest');
          sortTxtEl.id = 'sort-lbl-txt';
          sortIcoEl = el('i', `fa-solid ${state.sortDir === 'desc' ? 'fa-arrow-down-wide-short' : 'fa-arrow-up-wide-short'}`);
          sortIcoEl.id = 'sort-ico';
          sortIcoEl.setAttribute('aria-hidden', 'true');
          sortBtn.append(sortTxtEl, sortIcoEl);
          sortBtn.addEventListener('click', () => {
            state.sortDir = state.sortDir === 'desc' ? 'asc' : 'desc';
            syncControlsAndList();
          });
          dynamicGlassCleanups.push(registerGlass(sortBtn, { preset: 'sort', trackPointer: true }));

          sortWrap.append(sortBtn);
          ctrlRow.append(pillsEl, sortWrap);
          controls.append(searchWrap, ctrlRow);

          // Section divider
          const divider = el('div', 'section-divider');
          sectionTitleEl = el('span', '', state.featuredOnly ? 'Featured Projects' : 'Projects');
          const countWrap = el('span');
          countEl = el('strong', '', '0');
          countEl.id = 'count';
          countWrap.append(countEl, document.createTextNode(' live'));
          divider.append(sectionTitleEl, el('div', 'div-line'), countWrap);

          // Grid
          gridEl = el('div');
          gridEl.id = 'grid';

          // Footer
          const footer = el('footer');
          footer.append(el('span', 'ft-l', `@${u.login} · GitHub Pages`));
          const ftR = el('div', 'ft-r');
          const ftLink = el('a');
          ftLink.href = `https://github.com/${GITHUB_USERNAME}`;
          ftLink.target = '_blank';
          ftLink.rel = 'noopener noreferrer';
          ftLink.title = 'GitHub';
          ftLink.setAttribute('aria-label', 'GitHub profile');
          const ftIco = el('i', 'fa-brands fa-github');
          ftIco.setAttribute('aria-hidden', 'true');
          ftLink.append(ftIco);
          ftR.append(ftLink);
          footer.append(ftR);

          main.append(hdr, controls, divider, gridEl, footer);
          pageEl.append(main);

          syncControlsAndList();
          wakeGlass(1050);
        }

        async function loadData() {
          state.loading = true;
          state.error = null;
          renderPage();

          try {
            const [userRes, reposRes, pinnedRes] = await Promise.allSettled([
              fetch(`https://api.github.com/users/${GITHUB_USERNAME}`),
              fetch(`https://api.github.com/users/${GITHUB_USERNAME}/repos?sort=pushed&per_page=100&type=owner`),
              fetch(`https://gh-pinned-repos.egoist.dev/?username=${GITHUB_USERNAME}`),
            ]);

            if (userRes.status === 'rejected' || !userRes.value.ok) throw new Error('User not found');
            if (reposRes.status === 'rejected' || !reposRes.value.ok) throw new Error('Repos not found');

            const userData = await userRes.value.json();
            const rawRepos = await reposRes.value.json();

            const nextPinned = new Set();
            if (pinnedRes.status === 'fulfilled' && pinnedRes.value.ok) {
              try {
                const pinnedData = await pinnedRes.value.json();
                pinnedData.forEach((p) => { if (p && p.repo) nextPinned.add(p.repo); });
              } catch {}
            }

            state.user = userData;
            state.repos = rawRepos
              .filter((r) => r.has_pages && !HIDDEN_REPOS.has(r.name.toLowerCase()))
              .sort((a, b) => new Date(b.pushed_at).getTime() - new Date(a.pushed_at).getTime());
            state.pinned = nextPinned;

            setTimeout(() => {
              state.loading = false;
              renderPage();
            }, 360);
          } catch (err) {
            state.error = err instanceof Error ? err.message : 'Failed to load GitHub projects';
            state.loading = false;
            renderPage();
          }
        }

        loadData();
      })();
    </script>
  </body>
</html>
